<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>      
</head>
<body>
    <h1>Create Account</h1>   
    <div class="form-section">
      <form id="createForm">
        <div class="field">
          <span class="field-label">Name</span>
          <input id="name" class="field-input" name="name" required autocomplete="off" />
        </div>
        <div class="field">
          <span class="field-label">Email</span>
          <input id="email" class="field-input" name="email" type="email" required autocomplete="off" />
        </div>
        <div class="field">
          <span class="field-label">Password</span>
          <input id="password" class="field-input" name="password" type="password" required autocomplete="off" />
        </div>
        <p class="form-actions">
          <button type="submit" class="primary" id="addBtn">Add</button>
        </p>
        <p id="createErr" class="err" hidden></p>
    </div>

  <div>
    
  </div>
</form>

    <button name="createBtn" type="submit">Create</button>
    <p id="createErr" hidden style="color: red;"></p>

<script src="/js/create.js"></script>
</body>

</html>
